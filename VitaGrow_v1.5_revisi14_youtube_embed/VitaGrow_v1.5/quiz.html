<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Knowledge Check - VitaGrow</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css"></head>
<body><header id="navbar-container"></header><main id="app-container" class="container py-4 flex-grow-1"></main><footer id="footer-container"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="js/data.js"></script><script src="js/utils.js"></script><script src="js/knowledge-data.js"></script><script src="js/knowledge.js"></script><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{if(!VitabyteStore.getState().assessment?.isCompleted){VitabyteApp.requireAssessmentAccess('education');return;}const pillar=new URLSearchParams(location.search).get('pillar')||VitabyteStore.getState().assessment?.lowestPillar||'hydration';document.getElementById('app-container').innerHTML=`<div class="mb-4"><h2 class="fw-bold">🧠 Knowledge Check</h2><p class="text-muted">Satu pertanyaan acak dari topik ${pillar}. Opsional dan hanya untuk pemahaman.</p></div><div id="kc"></div><a href="learn-detail.html?pillar=${pillar}" class="btn btn-outline-secondary w-100 mt-3">← Kembali ke Materi</a>`;KnowledgeView.render(document.getElementById('kc'),pillar);});</script></body></html>
