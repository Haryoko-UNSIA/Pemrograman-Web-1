<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Daily Tracking - VitaGrow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header id="navbar-container"></header>
  <main id="app-container" class="container py-4 flex-grow-1"></main>
  <footer id="footer-container"></footer>
  <div id="modal-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/challenge.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const state = VitabyteStore.getState();
      if (!state.assessment?.isCompleted) { VitabyteApp.requireAssessmentAccess('challenge'); return; }
      if (!state.challenge || !state.challenge.activeChallengeId) {
        window.location.href = 'challenge-hub.html';
      } else {
        ChallengeView.renderDailyTrackingPage(document.getElementById('app-container'), state);
      }
    });
  </script>
</body>
</html>
