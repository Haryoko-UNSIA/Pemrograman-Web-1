<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Education - VitaGrow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header id="navbar-container"></header>
  <main id="app-container" class="container py-4 flex-grow-1"></main>
  <footer id="footer-container"></footer>
  <div id="modal-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/freedom.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!VitabyteStore.getState().assessment?.isCompleted) { VitabyteApp.requireAssessmentAccess('education'); } else { document.addEventListener('DOMContentLoaded', () => { FreedomView.renderEducationPage(document.getElementById('app-container'), VitabyteStore.getState()); }); }
  </script>
</body>
</html>
